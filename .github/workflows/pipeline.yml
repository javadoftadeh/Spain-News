name: Update, translate and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"

permissions:
  contents: write

concurrency:
  group: spain-news-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, translate and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_MIN_PRIORITY: "78"
          TELEGRAM_MAX_POSTS: "3"
          MAX_AI_TRANSLATIONS: "12"
        run: python scripts/pipeline.py
      - name: Commit data and delivery state
        run: |
          git config user.name "spain-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/posted.json
          git diff --cached --quiet || git commit -m "chore: refresh translated news"
          git push
